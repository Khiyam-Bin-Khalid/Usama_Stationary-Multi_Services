<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Usama Book Depot — online store and POS">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Usama Book Depot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Usama Book Depot</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e2d1c3">
  <style>
    /* Brand background — same gradient the Flutter theme paints, so there is
       no white flash while the engine loads and the browser chrome matches. */
    html, body {
      margin: 0;
      min-height: 100%;
      background-color: #e2d1c3;
      background-image: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
      background-attachment: fixed;
      color: #2b1d14;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #33271e;
        background-image: linear-gradient(135deg, #1e1712 0%, #33271e 100%);
        color: #f3ebe3;
      }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
